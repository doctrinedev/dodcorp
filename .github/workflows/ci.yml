name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
# `main` is exempt: every commit on the default branch gets a real result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml disagrees with the manifests,
      # so a dependency change can never land without its lockfile.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # ADR-0001 §Enforcement #1. Regenerates each package's public API surface
      # from the built .d.ts and fails if the committed api-report.md drifted,
      # so a semver-relevant change has to show up as a reviewable diff in the
      # PR rather than relying on a reviewer to notice it. `pnpm api:update`
      # refreshes the report locally.
      - name: Check public API surface
        run: pnpm run check:api

      # Catches broken "exports" maps and wrong type resolution before they
      # reach the registry, where a bad publish is immutable.
      - name: Validate publishable packages
        run: pnpm run check:package

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test
